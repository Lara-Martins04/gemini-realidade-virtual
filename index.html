<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aedes AR - Ciclo de Vida</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px); border-radius: 25px; padding: 10px;
            display: flex; justify-content: space-around; z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .phase-btn {
            background: none; border: none; color: white; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; opacity: 0.5;
            transition: 0.3s; padding: 10px;
        }
        .phase-btn.active { opacity: 1; transform: scale(1.1); }
        .icon-box {
            width: 50px; height: 50px; background: white; border-radius: 12px;
            margin-bottom: 5px; display: flex; align-items: center; justify-content: center;
        }
        .icon-box img { width: 70%; height: 70%; object-fit: contain; }
        .label { font-size: 10px; font-weight: bold; text-transform: uppercase; }
        #msg { 
            position: fixed; top: 20px; width: 100%; text-align: center; 
            color: white; z-index: 1000; font-size: 14px; text-shadow: 0 0 5px black;
        }
    </style>
</head>

<body>
    <div id="msg">Aponte para a imagem de ativação</div>

    <div id="ui-container">
        <button class="phase-btn active" onclick="changePhase('ovo', this)">
            <div class="icon-box"><img src="https://img.icons8.com/color/96/egg.png"></div>
            <span class="label">Ovo</span>
        </button>
        <button class="phase-btn" onclick="changePhase('larva', this)">
            <div class="icon-box"><img src="https://img.icons8.com/color/48/caterpillar.png"></div>
            <span class="label">Larva</span>
        </button>
        <button class="phase-btn" onclick="changePhase('pupa', this)">
            <div class="icon-box"><img src="https://img.icons8.com/color/48/pupa.png"></div>
            <span class="label">Pupa</span>
        </button>
        <button class="phase-btn" onclick="changePhase('mosquito', this)">
            <div class="icon-box"><img src="https://img.icons8.com/color/48/mosquito.png"></div>
            <span class="label">Mosquito</span>
        </button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <a-asset-item id="m-ovo" src="ovo.glb"></a-asset-item>
            <a-asset-item id="m-larva" src="larva.glb"></a-asset-item>
            <a-asset-item id="m-pupa" src="pupa.glb"></a-asset-item>
            <a-asset-item id="m-mosquito" src="mosquito.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="marcador.patt">
            <a-entity id="main-model" position="0 0 0" scale="1 1 1"
                      gltf-model="#m-ovo"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>
        </a-marker>

        <a-entity light="type: ambient; intensity: 1;"></a-entity>
        <a-entity light="type: directional; intensity: 0.5; position: 1 2 1"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function changePhase(id, el) {
            document.getElementById('main-model').setAttribute('gltf-model', `#m-${id}`);
            document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR: Ciclo de Vida do Aedes aegypti</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Oculta a barra de rolagem horizontal mantendo a funcionalidade */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Garante que o canvas do A-Frame fique no fundo */
    .a-canvas {
      z-index: 0 !important;
    }
    
    /* Remove a interface de debug padrão do AR.js/A-Frame caso apareça */
    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>
<body class="m-0 overflow-hidden font-sans bg-black">

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="antialias: true; alpha: true"
  >
    <a-assets>
      <a-asset-item id="glb-ovo" src="https://modelviewer.dev/shared-assets/models/shishkebab.glb"></a-asset-item>
      <a-asset-item id="glb-larva" src="https://modelviewer.dev/shared-assets/models/Horse.glb"></a-asset-item>
      <a-asset-item id="glb-pupa" src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"></a-asset-item>
      <a-asset-item id="glb-mosquito" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">
      <a-entity 
        id="modelo-ativo"
        gltf-model="#glb-ovo"
        scale="0.5 0.5 0.5"
        position="0 0 0"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div class="fixed bottom-0 w-full bg-white z-10 rounded-t-3xl shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)]">
    <div class="p-5 md:p-8 max-w-3xl mx-auto">
      <h2 class="text-xs font-bold text-gray-500 mb-4 uppercase tracking-widest text-center md:text-left">
        Fases do Ciclo
      </h2>
      
      <div id="nav-container" class="flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory pb-2 justify-start md:justify-center">
        </div>
    </div>
  </div>

  <script>
    // Definição das 4 fases solicitadas
    const fases = [
      { id: 'ovo', nome: 'Ovo', asset: '#glb-ovo', icone: '🥚' },
      { id: 'larva', nome: 'Larva', asset: '#glb-larva', icone: '🐛' },
      { id: 'pupa', nome: 'Pupa', asset: '#glb-pupa', icone: '🪲' },
      { id: 'mosquito', nome: 'Mosquito', asset: '#glb-mosquito', icone: '🦟' }
    ];

    let faseAtiva = 'ovo';
    const containerNav = document.getElementById('nav-container');
    const modeloAtivo = document.getElementById('modelo-ativo');

    function renderizarBotoes() {
      containerNav.innerHTML = '';
      
      fases.forEach(fase => {
        const isAtivo = fase.id === faseAtiva;
        const btn = document.createElement('button');
        
        // Classes baseadas na imagem de referência: quadrado de cantos arredondados, fundo cinza claro, borda azul quando ativo
        btn.className = `snap-center shrink-0 flex flex-col items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-2xl transition-all duration-300 bg-slate-50 border-2 ${
          isAtivo ? 'border-blue-500 shadow-md transform scale-105' : 'border-gray-200 hover:bg-slate-100'
        }`;
        
        btn.onclick = () => mudarFase(fase.id);

        // Usando emojis como placeholder para as imagens reais das fases
        btn.innerHTML = `
          <div class="text-3xl md:text-4xl mb-1">${fase.icone}</div>
        `;
        
        containerNav.appendChild(btn);
      });
    }

    function mudarFase(idFase) {
      faseAtiva = idFase;
      const faseSelecionada = fases.find(f => f.id === idFase);
      
      // Atualiza o atributo do A-Frame para trocar o modelo 3D
      modeloAtivo.setAttribute('gltf-model', faseSelecionada.asset);
      
      // Re-renderiza a UI para atualizar o botão com borda azul
      renderizarBotoes();
    }

    // Inicializa a interface
    renderizarBotoes();
  </script>
</body>
</html>
